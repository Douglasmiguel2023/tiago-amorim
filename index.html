<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>Tiago Amorim — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000;
    --charcoal:#2F2F2F;
    --charcoal-deep:#171717;
    --gold:#A07F3A;
    --gold-light:#E9CE8C;
    --gold-pale:#F4E3B2;
    --wheat:#C8AA6F;
    --sand:#E3D5BB;
    --sand-dim:rgba(227,213,187,.68);
    --btn-bg:#1B1B1B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Montserrat',sans-serif;
    color:var(--sand);
    background:
      radial-gradient(1100px 700px at 85% -10%, rgba(200,170,111,.20), transparent 60%),
      radial-gradient(900px 650px at -15% 35%, rgba(160,127,58,.16), transparent 60%),
      radial-gradient(800px 600px at 110% 78%, rgba(47,47,47,.55), transparent 60%),
      linear-gradient(168deg, #0A0A0A 0%, var(--black) 46%, #141210 100%);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  .bg-motion{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg-motion .glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 18s ease-in-out infinite alternate}
  .glow.g1{width:420px;height:420px;left:-140px;top:-120px;background:rgba(200,170,111,.34)}
  .glow.g2{width:360px;height:360px;right:-120px;top:34%;background:rgba(160,127,58,.28);animation-delay:-6s;animation-duration:22s}
  .glow.g3{width:300px;height:300px;left:22%;bottom:-140px;background:rgba(47,47,47,.8);animation-delay:-12s}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(46px,34px) scale(1.08)}}
  .bg-lines{position:absolute;inset:-20% -10%;opacity:.35;background:repeating-linear-gradient(115deg, transparent 0 118px, rgba(227,213,187,.10) 118px 119px, transparent 119px 236px),repeating-linear-gradient(115deg, transparent 0 197px, rgba(160,127,58,.22) 197px 198px, transparent 198px 394px);animation:linesMove 26s linear infinite}
  @keyframes linesMove{from{transform:translateX(0)}to{transform:translateX(120px)}}
  #dust{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
  .mote{position:absolute;top:-4vh;border-radius:50%;background:radial-gradient(circle, var(--gold-pale) 0%, var(--wheat) 45%, rgba(200,170,111,0) 75%);box-shadow:0 0 8px rgba(200,170,111,.8);animation:fall linear infinite;will-change:transform}
  @keyframes fall{0%{transform:translate3d(0,-4vh,0)}25%{transform:translate3d(2.6vw,26vh,0)}50%{transform:translate3d(-2vw,54vh,0)}75%{transform:translate3d(2.2vw,80vh,0)}100%{transform:translate3d(-1.4vw,106vh,0)}}
  .page{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:20px 20px 44px;display:flex;flex-direction:column;align-items:center}
  .brand{text-align:center;animation:rise .9s ease both}
  .brand h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(21px,5.8vw,28px);letter-spacing:.16em;line-height:1.05;color:var(--sand);text-shadow:0 0 24px rgba(200,170,111,.35)}
  .brand .rule{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px auto 7px;width:min(210px,58vw)}
  .brand .rule::before,.brand .rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .brand .rule span{width:5px;height:5px;background:var(--wheat);transform:rotate(45deg);flex:none}
  .brand p{font-size:8.5px;font-weight:600;letter-spacing:.28em;color:var(--wheat);text-transform:uppercase}
  .brand .handle{margin-top:5px;font-size:10px;letter-spacing:.06em;color:var(--sand-dim);font-weight:500}
  .stage{position:relative;width:100%;display:flex;justify-content:center;margin-top:18px;animation:rise .9s .12s ease both;isolation:isolate}
  .arch-wrap{position:relative;width:min(160px,42vw);z-index:3}
  .arch{position:relative;border-radius:50%;padding:12px;background:linear-gradient(160deg, rgba(200,170,111,.20), rgba(47,47,47,.35));border:1.5px solid var(--gold);box-shadow:0 0 55px rgba(160,127,58,.40), 0 24px 48px rgba(0,0,0,.65), inset 0 1px 0 rgba(227,213,187,.25)}
  .arch::before{content:"";position:absolute;inset:7px;border-radius:inherit;border:1.5px solid var(--wheat);pointer-events:none;z-index:4}
  .arch .diamond{position:absolute;top:46%;width:17px;height:17px;z-index:5;background:var(--charcoal-deep);border:1.5px solid var(--gold);transform:rotate(45deg);box-shadow:0 0 16px rgba(200,170,111,.85)}
  .diamond.dl{left:-9px}.diamond.dr{right:-9px}
  .viewport{position:relative;border-radius:50%;overflow:hidden;aspect-ratio:3/4;background:var(--charcoal)}
  .viewport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;opacity:0;transform:scale(1.04);transition:opacity .8s ease, transform 1.4s ease}
  .viewport img.active{opacity:1;transform:scale(1)}
  .nav-arrow{position:absolute;top:44%;z-index:6;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gold);background:rgba(0,0,0,.45);backdrop-filter:blur(3px);color:var(--sand);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px rgba(160,127,58,.5);transition:transform .25s ease, background .25s ease;-webkit-tap-highlight-color:transparent}
  .nav-arrow:hover{background:rgba(47,47,47,.75);transform:scale(1.07)}
  .nav-arrow:active{transform:scale(.96)}
  .nav-arrow.prev{left:-48px}.nav-arrow.next{right:-48px}
  @media(min-width:480px){.nav-arrow.prev{left:-64px}.nav-arrow.next{right:-64px}}
  .dots{display:flex;gap:8px;justify-content:center;margin-top:16px}
  .dots button{width:8px;height:8px;border-radius:50%;border:1px solid var(--gold);background:transparent;cursor:pointer;padding:0;transition:all .3s}
  .dots button.active{background:var(--wheat);width:22px;border-radius:99px}
  .bands{position:absolute;left:calc(50% - 50vw);bottom:14px;width:100vw;height:64px;pointer-events:none;z-index:1}
  .band{position:absolute;left:-4%;width:108%;overflow:hidden;white-space:nowrap;padding:7px 0}
  .band.back{top:0;transform:rotate(1.8deg);background:linear-gradient(180deg, var(--charcoal), #1E1E1E);box-shadow:0 8px 18px rgba(0,0,0,.55);border-top:1px solid rgba(160,127,58,.55);border-bottom:1px solid rgba(160,127,58,.55)}
  .band.front{top:28px;transform:rotate(-1.6deg);background:linear-gradient(180deg, var(--gold-light), var(--wheat) 55%, var(--gold));box-shadow:0 10px 22px rgba(0,0,0,.6)}
  .band .track{display:inline-flex;animation:scrollX 30s linear infinite;will-change:transform}
  .band.back .track{animation-duration:38s;animation-direction:reverse}
  .band span{font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:.24em;font-size:12.5px;padding-right:.6em;text-transform:uppercase}
  .band.front span{color:#141000}
  .band.back span{color:var(--sand)}
  @keyframes scrollX{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @property --btn-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
  .links{width:100%;max-width:430px;display:flex;flex-direction:column;gap:12px;margin-top:14px}
  .link-btn{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:11px 18px 11px 13px;border-radius:999px;text-decoration:none;cursor:pointer;background:linear-gradient(180deg, rgba(227,213,187,.10), rgba(255,255,255,0) 46%), var(--btn-bg);border:none;box-shadow:0 10px 20px rgba(0,0,0,.55), 0 0 18px rgba(160,127,58,.22), inset 0 1px 0 rgba(227,213,187,.14), inset 0 -6px 12px rgba(0,0,0,.5);color:var(--sand);transition:transform .25s ease, box-shadow .25s ease;animation:rise .8s ease both;-webkit-tap-highlight-color:transparent;font-family:inherit;text-align:left}
  .links .link-btn:nth-child(1){animation-delay:.22s}
  .links .link-btn:nth-child(2){animation-delay:.32s}
  .links .link-btn:nth-child(3){animation-delay:.42s}
  .link-btn::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--btn-angle), var(--gold-pale) 0deg, var(--gold-light) 45deg, var(--gold) 90deg, rgba(160,127,58,.12) 150deg, #7A5F24 215deg, rgba(244,227,178,.45) 285deg, var(--gold-pale) 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);mask-composite:exclude;animation:btnContour 5.5s linear infinite;pointer-events:none}
  @keyframes btnContour{to{--btn-angle:360deg}}
  .link-btn::after{content:"";position:absolute;left:-5px;top:50%;width:15px;height:15px;margin-top:-7.5px;background:radial-gradient(circle, #FFFFFF 0%, var(--gold-light) 42%, rgba(160,127,58,0) 72%);clip-path:polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);filter:drop-shadow(0 0 6px rgba(233,206,140,.95));animation:sparkle 2.4s ease-in-out infinite alternate;pointer-events:none;z-index:2}
  .link-btn .arrow::after{content:"";position:absolute;right:-5px;top:50%;width:15px;height:15px;margin-top:-7.5px;background:radial-gradient(circle, #FFFFFF 0%, var(--gold-light) 42%, rgba(160,127,58,0) 72%);clip-path:polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);filter:drop-shadow(0 0 6px rgba(233,206,140,.95));animation:sparkle 2.4s ease-in-out -1.2s infinite alternate;pointer-events:none}
  @keyframes sparkle{from{transform:scale(.55) rotate(0deg);opacity:.45}to{transform:scale(1.15) rotate(28deg);opacity:1}}
  .link-btn:hover{transform:translateY(-2px);box-shadow:0 14px 24px rgba(0,0,0,.65), 0 0 24px rgba(160,127,58,.35), inset 0 1px 0 rgba(227,213,187,.14)}
  .link-btn:active{transform:translateY(0) scale(.99)}
  .icon-circle{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);color:var(--wheat);display:flex;align-items:center;justify-content:center;background:rgba(200,170,111,.10)}
  .icon-circle svg{width:18px;height:18px}
  .link-btn .label{flex:1;min-width:0}
  .link-btn .label strong{display:block;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:16.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--sand);line-height:1.15}
  @media(max-width:480px){.link-btn .label strong{font-size:13.5px;letter-spacing:.06em}.link-btn .label small{font-size:9.5px;letter-spacing:.05em}}
  .link-btn .label small{display:block;margin-top:1px;font-size:10px;letter-spacing:.07em;color:var(--sand-dim);font-weight:500}
  .link-btn .arrow{flex:none;font-size:17px;color:var(--wheat);transition:transform .25s ease}
  .link-btn:hover .arrow{transform:translateX(4px)}
  .toast{margin-top:14px;font-size:12px;letter-spacing:.05em;color:var(--sand);background:rgba(27,27,27,.92);border:1px solid var(--gold);border-radius:99px;padding:9px 16px;opacity:0;transform:translateY(6px);transition:all .35s ease;pointer-events:none;text-align:center;max-width:430px}
  .toast.show{opacity:1;transform:translateY(0)}
  footer{margin-top:24px;text-align:center;animation:rise .9s .5s ease both}
  footer .impact{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(17px,4.6vw,21px);line-height:1.4;color:var(--sand);max-width:420px;margin:0 auto}
  footer .impact::before,footer .impact::after{content:"";display:block;width:44px;height:1px;margin:0 auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  footer .impact::before{margin-bottom:12px}
  footer .impact::after{margin-top:12px}
  footer .foot-name{margin-top:16px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:16px;letter-spacing:.28em;color:var(--sand)}
  footer .foot-sub{margin-top:5px;font-size:8.5px;font-weight:600;letter-spacing:.3em;color:var(--wheat);text-transform:uppercase}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .intro{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(900px 620px at 85% -10%, rgba(200,170,111,.22), transparent 60%),radial-gradient(760px 560px at -12% 40%, rgba(160,127,58,.16), transparent 60%),linear-gradient(168deg, #0A0A0A 0%, var(--black) 55%, #141210 100%);transition:opacity .9s ease}
  .intro-blur{width:min(300px,64vw);height:min(300px,64vw);border-radius:50%;flex:none;background:radial-gradient(circle at 42% 38%, rgba(244,227,178,.95) 0%, rgba(200,170,111,.85) 34%, rgba(160,127,58,.66) 62%, rgba(47,47,47,.40) 82%, rgba(47,47,47,0) 100%);filter:blur(26px);box-shadow:0 0 90px rgba(160,127,58,.55), 0 0 160px rgba(160,127,58,.30);animation:introPulse 2.6s ease-in-out infinite alternate;will-change:transform,opacity,filter}
  @keyframes introPulse{from{transform:scale(1);opacity:.84;filter:blur(24px)}to{transform:scale(1.13);opacity:1;filter:blur(32px)}}
  .intro-word{position:absolute;left:50%;top:50%;z-index:2;width:100%;transform:translate(-50%,-50%);font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:clamp(24px,6.4vw,32px);letter-spacing:.04em;color:var(--sand);min-height:1.4em;text-align:center;padding:0 20px;text-shadow:0 2px 14px rgba(0,0,0,.9), 0 0 26px rgba(0,0,0,.65);opacity:1;transition:opacity .45s ease, transform .45s ease;pointer-events:none}
  .intro-word.swap{opacity:0;transform:translate(-50%,calc(-50% + 6px))}
  .intro.expand .intro-blur{animation:none;transform:scale(7);filter:blur(70px);opacity:.95;transition:transform 1.15s ease, filter 1.15s ease, opacity 1.15s ease}
  .intro.expand .intro-word{opacity:0;transition:opacity .4s ease}
  .intro.done{opacity:0;pointer-events:none}
  body.intro-lock{overflow:hidden}
  @media (prefers-reduced-motion: reduce){.bg-lines,.bg-motion .glow,.band .track,.link-btn::before,.link-btn::after,.link-btn .arrow::after,.intro-blur{animation:none}.mote{display:none}*{transition:none!important}}
</style>
</head>
<body class="intro-lock">

<div class="intro" id="intro" role="status" aria-label="Carregando">
  <div class="intro-blur" aria-hidden="true"></div>
  <div class="intro-word" id="introWord">Maquiagem...</div>
</div>

<div class="bg-motion" aria-hidden="true">
  <div class="bg-lines"></div>
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
</div>
<div id="dust" aria-hidden="true"></div>

    <button type="button" class="link-btn" data-pending="Agendamento">
      <span class="icon-circle" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 16.2l2 2 4-4.2"/></svg>

</main>

<script>
(function(){
  var intro = document.getElementById("intro");
  var introWord = document.getElementById("introWord");
  var reduceIntro = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var introFinished = false;
  function finishIntro(){
    if (introFinished || !intro) return;
    introFinished = true;
    intro.classList.add("expand");
    setTimeout(function(){
      intro.classList.add("done");
      document.body.classList.remove("intro-lock");
      setTimeout(function(){ if (intro.parentNode) intro.parentNode.removeChild(intro); }, 950);
    }, reduceIntro ? 60 : 1150);
  }
  if (intro && introWord){
    if (reduceIntro){
      introWord.textContent = "Maquiagem...";
      setTimeout(finishIntro, 700);
    } else {
      var words = ["Maquiagem...", "Penteados...", "Beleza...", "Estilo..."];
      var wi = 0;
      var wordTimer = setInterval(function(){
        wi++;
        if (wi >= words.length){ clearInterval(wordTimer); return; }
        introWord.classList.add("swap");
        setTimeout(function(){
          introWord.textContent = words[wi];
          introWord.classList.remove("swap");
        }, 450);
      }, 1150);
      setTimeout(function(){ clearInterval(wordTimer); finishIntro(); }, 5300);
    }
    intro.addEventListener("click", finishIntro);
    setTimeout(finishIntro, 6000);
    setTimeout(function(){
      if (intro.parentNode) intro.parentNode.removeChild(intro);
      document.body.classList.remove("intro-lock");
    }, 8000);
  }
  var phrase = "Maquiagem \u2726 Penteados \u2726 Beleza \u2726 Estilo \u2726 Atendimento a Domicílio \u2726 ";
  var html = "";
  for (var r=0;r<4;r++){ html += "<span>" + phrase + "</span>"; }
  document.querySelectorAll("[data-band]").forEach(function(t){ t.innerHTML = html; });
  var imgs = Array.prototype.slice.call(document.querySelectorAll("#viewport img"));
  var dotsBox = document.getElementById("dots");
  var idx = 0, timer = null, resumeTimer = null;
  imgs.forEach(function(_, i){
    var b = document.createElement("button");
    b.setAttribute("aria-label", "Foto " + (i+1));
    if (i===0) b.className = "active";
    b.addEventListener("click", function(){ go(i); pauseAuto(); });
    dotsBox.appendChild(b);
  });
  var dots = Array.prototype.slice.call(dotsBox.children);
  function go(n){
    imgs[idx].classList.remove("active"); dots[idx].classList.remove("active");
    idx = (n + imgs.length) % imgs.length;
    imgs[idx].classList.add("active"); dots[idx].classList.add("active");
  }
  function startAuto(){ clearInterval(timer); timer = setInterval(function(){ go(idx+1); }, 5000); }
  function pauseAuto(){ clearInterval(timer); clearTimeout(resumeTimer); resumeTimer = setTimeout(startAuto, 10000); }
  document.getElementById("prevBtn").addEventListener("click", function(){ go(idx-1); pauseAuto(); });
  document.getElementById("nextBtn").addEventListener("click", function(){ go(idx+1); pauseAuto(); });
  var startX = null, vp = document.getElementById("viewport");
  vp.addEventListener("touchstart", function(e){ startX = e.touches[0].clientX; }, {passive:true});
  vp.addEventListener("touchend", function(e){
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 36){ go(dx < 0 ? idx+1 : idx-1); pauseAuto(); }
    startX = null;
  }, {passive:true});
  startAuto();
  var toast = document.getElementById("toast"), toastTimer = null;
  document.querySelectorAll("[data-pending]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var name = btn.getAttribute("data-pending");
      toast.textContent = name + " em breve — canal sendo ativado.";
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 3200);
    });
  });
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce){
    var box = document.getElementById("dust");
    var count = window.innerWidth < 560 ? 9 : 14;
    for (var i=0;i<count;i++){
      var p = document.createElement("div");
      p.className = "mote";
      var size = 3 + Math.random()*5;
      p.style.width = size + "px";
      p.style.height = size + "px";
      p.style.left = (Math.random()*100) + "vw";
      p.style.animationDuration = (12 + Math.random()*11) + "s";
      p.style.animationDelay = (-Math.random()*18) + "s";
      p.style.opacity = (0.35 + Math.random()*0.5).toFixed(2);
      box.appendChild(p);
    }
  }
})();
</script>
</body>
</html>
